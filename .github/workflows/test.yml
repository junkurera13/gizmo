name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s friend/tests -p 'test_*.py'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run mjs tests
        working-directory: friend/tests
        run: for f in *.test.mjs; do node --test "$f" || exit 1; done

  deploy:
    needs: [python, node]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 4e9d895f-7559-4def-8700-bea6a5301320
      RAILWAY_ENVIRONMENT_ID: 567e3619-4736-4d70-adb7-dc35b95c25a9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy gizmo-brain
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          for attempt in 1 2 3; do
            npx --yes @railway/cli@5.52.1 up --service gizmo-brain -y && exit 0
            echo "deploy attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - name: Deploy memobase when its source changes
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: |
          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^deploy/memobase/'; then
            echo "deploy/memobase unchanged; skipping"
            exit 0
          fi
          for attempt in 1 2 3; do
            npx --yes @railway/cli@5.52.1 up --service memobase -y && exit 0
            echo "deploy attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - name: Report a missing deploy token
        if: ${{ env.RAILWAY_TOKEN == '' }}
        run: echo "::warning::RAILWAY_TOKEN secret is not set; Railway deploy skipped. See docs/DEPLOYMENT.md."
