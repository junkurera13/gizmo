<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gizmo</title>
  <link rel="stylesheet" href="/static/app.css?v=3" />
</head>
<body>
  <main class="room">
    <header class="top">
      <p class="mark">Gizmo</p>
      <p class="meta">
        <span id="state">powered_off</span>
        <span id="path"></span>
      </p>
    </header>

    <section class="handheld" aria-label="Gizmo glass">
      <div class="bezel">
        <div id="glass" class="glass"></div>
      </div>
      <p id="speaker" class="speaker" aria-live="polite"></p>
    </section>

    <section class="controls">
      <div class="row">
        <button type="button" id="power" title="Toggle physical power">Power on</button>
        <button type="button" id="up" title="Navigate up" aria-label="Navigate up">▲</button>
        <button type="button" id="down" title="Navigate down" aria-label="Navigate down">▼</button>
        <button type="button" id="select" title="Select">Select</button>
        <button type="button" id="ptt" class="mic" aria-pressed="false">PTT</button>
      </div>
      <form id="say">
        <input id="line" type="text" autocomplete="off" placeholder="Say something." />
        <button type="submit">Say</button>
      </form>
      <form id="look">
        <input id="hint" type="text" autocomplete="off" placeholder="World camera hint — e.g. a pinecone on the table" />
        <button type="submit">Point</button>
      </form>
      <p class="keys">P: power · ↑/↓: navigate · Space: select · hold PTT to talk (wakes him too)</p>
    </section>
  </main>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
