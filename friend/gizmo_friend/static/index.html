<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gizmo</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <main class="room">
    <header class="top">
      <p class="mark">Gizmo</p>
      <p class="meta">
        <span id="state">asleep</span>
        <span id="path"></span>
      </p>
    </header>

    <section class="handheld" aria-label="Gizmo glass">
      <div class="bezel">
        <div id="glass" class="glass">
          <img id="still" alt="" />
          <video id="clip" playsinline muted></video>
        </div>
      </div>
      <p id="speaker" class="speaker" aria-live="polite"></p>
    </section>

    <section class="controls">
      <div class="row">
        <button type="button" id="stick" class="stick" title="Click stick — wake, interrupt, sleep">Stick</button>
        <button type="button" id="reach" class="reach" title="Hold stick — send the page home">Hold to reach</button>
        <button type="button" id="mic" class="mic" aria-pressed="false">Mic</button>
      </div>
      <form id="say">
        <input id="line" type="text" autocomplete="off" placeholder="Say something. He stops after two sentences." />
        <button type="submit">Say</button>
      </form>
      <form id="look">
        <input id="hint" type="text" autocomplete="off" placeholder="World camera hint — e.g. a pinecone on the table" />
        <button type="submit">Point</button>
      </form>
      <p class="keys">Space: stick click · R: reach · Esc: interrupt/sleep</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
