<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151517">
  <title>OddityOS 1 — Gizmo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/oddity-boot.css?v=gate14">
  <link rel="stylesheet" href="/static/oddity.css">
  <link rel="stylesheet" href="/static/oddity-device.css?v=gate72">
  <link rel="stylesheet" href="/static/oddity-experience.css">
  <link rel="preload" as="image" href="/static/device-reference-ptt-pressed.png">
  <link rel="preload" as="image" href="/static/oddity-character-half.png?v=char3">
  <link rel="preload" as="image" href="/static/oddity-character-closed.png?v=char3">
  <link rel="preload" as="image" href="/static/oddity-listening-01.png?v=listen1">
  <link rel="preload" as="image" href="/static/oddity-listening-02.png?v=listen1">

  <link rel="preload" as="image" href="/static/oddity-listening-04.png?v=listen1">
  <link rel="preload" as="image" href="/static/oddity-listening-05.png?v=listen1">
  <link rel="preload" as="image" href="/static/oddity-listening-06.png?v=listen1">
  <link rel="preload" as="image" href="/static/oddity-listening-07.png?v=listen1">
  <link rel="preload" as="image" href="/static/oddity-boot-00.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-01.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-02.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-03.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-04.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-05.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-06.jpg?v=boot2">
  <link rel="preload" as="image" href="/static/oddity-boot-07.jpg?v=boot2">

  <script>
    try {
      if (!(sessionStorage.getItem('oddity-preview-v1') || localStorage.getItem('oddity-preview-v1'))) {
        document.documentElement.classList.add('oddity-locked');
      }
    } catch (error) {
      document.documentElement.classList.add('oddity-locked');
    }
  </script>
  <script type="module" src="/static/oddity.js?v=gate85"></script>
</head>
<body>
  <section id="preview-gate" class="preview-gate" aria-labelledby="preview-title" hidden>
    <form id="preview-form" class="preview-form">
      <div class="preview-blink" aria-hidden="true">
        <img id="preview-blink" src="/static/oddity-blink-10.jpg" alt="">
      </div>
      <h1 id="preview-title">Oddware Oddity 1.0</h1>
      <input id="preview-code" type="password" name="preview-code" placeholder="Code" autocomplete="current-password" aria-label="Preview code">
      <button type="submit">Enter</button>
      <p id="preview-error" class="preview-error" role="alert"></p>
    </form>
  </section>
  <script>
    if (document.documentElement.classList.contains('oddity-locked')) {
      document.getElementById('preview-gate').hidden = false;
    }
  </script>
  <main>
    <section class="simulator" aria-label="Gizmo simulator">
      <div id="device" class="device" aria-label="Gizmo handheld">
        <img class="device-art device-rest" src="/static/device-reference.png" alt="" draggable="false">
        <img class="device-art device-pressed" src="/static/device-reference-ptt-pressed.png" alt="" draggable="false">
        <div id="stage" class="stage" data-glass="off" data-state="off">
          <div class="glass">
            <div id="glass-dim" class="glass-dim" aria-hidden="true"></div>
            <div id="glass-boot" class="glass-boot" hidden>
              <img id="glass-boot-frame" alt="" draggable="false">
            </div>
            <div id="glass-home" class="glass-home" hidden>
              <div class="glass-hud">
                <span id="glass-clock" class="glass-clock"></span>
                <span id="glass-battery" class="glass-battery" aria-label="Battery">
                  <span class="glass-battery-body"><i></i></span>
                  <span class="glass-battery-nub" aria-hidden="true"></span>
                </span>
              </div>
              <div id="friend" class="friend"><img src="/static/oddity-character.png?v=char3" alt="" draggable="false"></div>
            </div>
            <div id="glass-settings" class="glass-settings" hidden>
              <div class="glass-setting" data-key="brightness">
                <i class="glass-caret" aria-hidden="true"></i>
                <div class="glass-setting-body">
                  <p>BRIGHTNESS</p>
                  <div class="glass-meter"></div>
                </div>
                <span class="glass-ticks" aria-hidden="true"></span>
              </div>
              <div class="glass-setting" data-key="volume">
                <i class="glass-caret" aria-hidden="true"></i>
                <div class="glass-setting-body">
                  <p>VOLUME</p>
                  <div class="glass-meter"></div>
                </div>
                <span class="glass-ticks" aria-hidden="true"></span>
              </div>
            </div>
            <div id="glass-camera" class="glass-camera" hidden>
              <div class="camera-finder">
                <video id="camera-feed" autoplay muted playsinline hidden></video>
                <span id="camera-status">CAMERA</span>
              </div>
            </div>
            <div id="scene" class="scene">
              <img id="still" alt="" hidden>
              <video id="film" muted playsinline preload="auto" hidden></video>
              <canvas id="orbit" class="orbit-canvas" aria-label="Orbit experiment: a satellite falling around Earth" hidden></canvas>
              <div id="demo-math" class="demo-math" role="img" hidden>
                <div class="math-cloud math-cloud-one" aria-hidden="true"></div>
                <div class="math-cloud math-cloud-two" aria-hidden="true"></div>
                <p id="math-attempt" class="math-attempt"></p>
                <div class="fraction-model" aria-hidden="true">
                  <svg viewBox="0 0 220 220">
                    <path class="fraction-piece is-shaded" d="M110 110 L110 12 A98 98 0 0 1 208 110 Z"/>
                    <path class="fraction-piece" d="M110 110 L208 110 A98 98 0 0 1 110 208 Z"/>
                    <path class="fraction-piece is-shaded" d="M110 110 L110 208 A98 98 0 0 1 12 110 Z"/>
                    <path class="fraction-piece" d="M110 110 L12 110 A98 98 0 0 1 110 12 Z"/>
                  </svg>
                </div>
                <div class="fraction-counts">
                  <div class="fraction-count fraction-shaded"><b>2</b><span id="math-shaded"></span></div>
                  <div class="fraction-count fraction-total"><b>4</b><span id="math-total"></span></div>
                </div>
                <p id="math-answer" class="math-answer"></p>
              </div>
              <div id="demo-rainbow" class="demo-rainbow" role="img" hidden>
                <div class="rainbow-atmosphere" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <svg viewBox="0 0 760 430" aria-hidden="true">
                  <defs>
                    <filter id="rainbow-glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="drop-shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#031a37" flood-opacity=".72"/></filter>
                    <radialGradient id="drop-fill" cx="34%" cy="23%" r="78%"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".3" stop-color="#a8efff" stop-opacity=".72"/><stop offset=".72" stop-color="#238fc9" stop-opacity=".34"/><stop offset="1" stop-color="#063b72" stop-opacity=".66"/></radialGradient>
                    <linearGradient id="drop-shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                  </defs>
                  <g class="rainbow-sun"><circle class="sun-halo" cx="78" cy="207" r="60"/><circle class="sun-core" cx="78" cy="207" r="34"/><g class="sun-rays"><path d="M78 151v-22M78 285v-22M22 207H2M154 207h-20M39 168l-16-16M117 246l16 16M117 168l16-16M39 246l-16 16"/></g></g>
                  <g class="incoming-light"><path class="beam beam-white-glow" d="M115 207 L282 207"/><path class="beam beam-white" d="M115 207 L282 207"/><circle class="light-runner" r="7"/></g>
                  <g class="drop-system" filter="url(#drop-shadow)">
                    <path class="rainbow-drop" d="M368 58 C368 58 268 193 268 265 C268 334 313 371 368 371 C423 371 468 334 468 265 C468 193 368 58 368 58Z"/>
                    <path class="drop-shine" d="M337 104 C300 161 287 197 286 225 C286 239 289 246 295 246 C303 246 308 229 317 204 C326 178 339 150 356 123 C363 112 360 101 352 98 C347 96 342 98 337 104Z"/>
                    <path class="beam beam-enter" d="M282 207 L418 288"/>
                    <path class="beam beam-reflect" d="M418 288 L337 329"/>
                    <path class="beam beam-exit" d="M337 329 L447 224"/>
                    <g class="entry-marker"><circle cx="282" cy="207" r="15"/><circle cx="282" cy="207" r="5"/></g>
                    <g class="reflection-marker"><circle cx="418" cy="288" r="16"/><path d="M409 291l9-9 9 9"/></g>
                  </g>
                  <g class="spectrum" filter="url(#rainbow-glow)">
                    <path class="ray red" d="M447 224 L744 126"/><path class="ray orange" d="M447 224 L744 151"/>
                    <path class="ray yellow" d="M447 224 L744 177"/><path class="ray green" d="M447 224 L744 205"/>
                    <path class="ray blue" d="M447 224 L744 235"/><path class="ray violet" d="M447 224 L744 267"/>
                  </g>
                  <g class="spectrum-particles">
                    <circle class="photon red" r="6"><animateMotion dur="1.8s" repeatCount="indefinite" path="M447 224 L744 126"/></circle>
                    <circle class="photon yellow" r="6"><animateMotion dur="1.8s" begin="-.6s" repeatCount="indefinite" path="M447 224 L744 177"/></circle>
                    <circle class="photon blue" r="6"><animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M447 224 L744 235"/></circle>
                    <circle class="photon violet" r="6"><animateMotion dur="1.8s" begin="-.25s" repeatCount="indefinite" path="M447 224 L744 267"/></circle>
                  </g>
                  <g class="rainbow-callout callout-one"><circle cx="214" cy="164" r="14"/><text x="214" y="169">1</text><text class="callout-copy" x="235" y="169">BENDS IN</text></g>
                  <g class="rainbow-callout callout-two"><circle cx="390" cy="350" r="14"/><text x="390" y="355">2</text><text class="callout-copy" x="411" y="355">REFLECTS</text></g>
                  <g class="rainbow-callout callout-three"><circle cx="560" cy="300" r="14"/><text x="560" y="305">3</text><text class="callout-copy" x="581" y="305">COLORS SPREAD</text></g>
                </svg>
              </div>
            </div>
            <div id="caption" class="caption" aria-live="polite"></div>
            <div id="interaction" class="interaction" aria-label="Explore with Gizmo" hidden></div>
            <button id="play-blocked" class="play-blocked" hidden>Tap to play narration</button>
            <div id="listening" class="listening" hidden></div>
            <div class="stage-top" hidden><span id="connection" class="connection"></span><span id="chapter-title"></span><button id="home" class="stage-home" type="button" hidden>↩</button></div>
            <div class="stage-bottom" hidden><span id="scene-position"></span><div id="beat-dots" class="beat-dots"></div><span id="scene-kind"></span></div>
          </div>
        </div>
        <button id="talk" type="button" class="device-control device-talk" aria-label="Hold to talk" title="Hold to talk · Space"></button>
        <button id="previous" type="button" class="device-control device-up" aria-label="Navigate up" title="Up · Settings">⌃</button>
        <button id="next" type="button" class="device-control device-down" aria-label="Navigate down" title="Down · Camera">⌄</button>
        <button id="select" type="button" class="device-control device-select" aria-label="Select" title="Select · Enter">✓</button>
      </div>
      <div class="power-bar">
        <button id="power" type="button" class="power-toggle" role="switch" aria-checked="false" aria-label="Power">
          <span class="power-track" aria-hidden="true"><span class="power-knob"></span></span>
          <span id="power-state">Off</span>
        </button>
      </div>
      <div id="moments" class="moments" hidden>
        <button id="moment-prev" type="button" aria-label="Previous moment">‹</button>
        <div class="moment-copy">
          <p id="moment-line"></p>
          <button id="moment-say" type="button">Play demo</button>
        </div>
        <button id="moment-next" type="button" aria-label="Next moment">›</button>
      </div>
    </section>
  </main>
  <audio id="voice" preload="auto"></audio>
  <audio id="demo-audio" preload="auto"></audio>
  <audio id="glass-boot-audio" src="/static/oddity-boot.wav" preload="auto"></audio>
</body>
</html>
