[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gizmo"
version = "0.1.0"
description = "Gizmo — a persistent realtime agent for the Gizmo device."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gizmo" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=14.0",
  "httpx>=0.28",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "certifi>=2024.0.0",
  "google-genai==2.21.0",
  "Pillow>=11.0",
  "imageio-ffmpeg>=0.6.0",
  "memobase==0.0.27",
  "audioop-lts>=0.2.2; python_version >= '3.13'",
]

[project.scripts]
gizmo = "gizmo_friend.__main__:main"

[tool.setuptools.packages.find]
where = ["friend"]
include = ["gizmo_friend*"]

[tool.setuptools.package-data]
gizmo_friend = ["static/*"]
