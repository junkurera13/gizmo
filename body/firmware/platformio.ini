; Reproducible board target. Pin map: include/gizmo/board.h.
; Boot/home art is the export_bundle.py output embedded in flash; regenerate
; with tools/embed_assets.py after changing anything under glass/.
[platformio]
default_envs = xiao_esp32s3_sense

[env:xiao_esp32s3_sense]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DWEBSOCKETS_MAX_DATA_SIZE=98304
lib_deps =
    links2004/WebSockets@2.4.1
    bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:extra_ws_size.py
; Optional compile-time Friend target (NVS/serial F and K override these):
;    -DGIZMO_BRAIN_URL='"https://your-brain.example"'
;    -DGIZMO_DEVICE_TOKEN='"your-device-token"'
; BEGIN embed_assets.py
board_build.embed_files =
    assets/boot_00.jpg
    assets/boot_01.jpg
    assets/boot_02.jpg
    assets/boot_03.jpg
    assets/boot_04.jpg
    assets/boot_05.jpg
    assets/boot_06.jpg
    assets/boot_07.jpg
    assets/boot_08.jpg
    assets/boot_09.jpg
    assets/boot_10.jpg
    assets/boot_11.jpg
    assets/boot_12.jpg
    assets/boot_13.jpg
    assets/boot_14.jpg
    assets/home_base.jpg
    assets/idle_00.jpg
    assets/idle_01.jpg
    assets/idle_02.jpg
    assets/listening_00.jpg
    assets/listening_01.jpg
    assets/listening_02.jpg
    assets/listening_03.jpg
    assets/listening_04.jpg
    assets/listening_05.jpg
    assets/listening_06.jpg
    assets/heart_empty.rgb565a
    assets/heart_half.rgb565a
    assets/heart_full.rgb565a
    assets/clock_atlas.a8
    assets/boot_chime.pcm16
; END embed_assets.py
